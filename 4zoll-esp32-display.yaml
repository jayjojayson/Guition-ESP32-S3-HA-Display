# =============================================================================
#  HARDWARE  (aus der offiziellen Guition-Board-Definition – nicht ändern)
# =============================================================================
button:
  - platform: restart
    id: btn_restart_dev
    name: "Display Neustart"

output:
  - platform: ledc
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    pin: 38
    zero_means_zero: true

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    default_transition_length: 1s
    output: backlight_output
    restore_mode: ALWAYS_ON

spi:
  - id: lcd_spi
    clk_pin: 48
    mosi_pin: 47

i2c:
  - id: touchscreen_bus
    scl:
      ignore_strapping_warning: true
      number: 45
    sda: 19

display:
  - platform: st7701s
    id: tft_display
    auto_clear_enabled: false
    color_order: RGB
    cs_pin: 39
    data_pins:
      blue:  [4, 5, 6, 7, 15]
      green: [8, 20, 3, 46, 9, 10]
      red:   [11, 12, 13, 14, 0]
    data_rate: 2MHz
    de_pin: 18
    dimensions:
      height: 480
      width: 480
    hsync_back_porch: 20
    hsync_front_porch: 10
    hsync_pin: 16
    hsync_pulse_width: 8
    init_sequence: [1, [255, 119, 1, 0, 0, 16], [205, 0]]
    invert_colors: false
    pclk_frequency: 12MHz
    pclk_inverted: false
    pclk_pin: 21
    spi_mode: MODE3
    update_interval: never
    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pin: 17
    vsync_pulse_width: 8

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - lambda: "id(g_lastact) = millis(); id(g_saver) = false;"
      - light.turn_on:
          id: display_backlight
          brightness: !lambda "return id(g_bright) / 100.0;"
      - lvgl.widget.update: { id: page_home, bg_image_opa: COVER }
      - lvgl.widget.update: { id: card_power, bg_opa: COVER }
      - lvgl.widget.update: { id: card_temp, bg_opa: COVER }
      - lvgl.widget.update: { id: card_soc, bg_opa: COVER }
      - lvgl.widget.show: lbl_n_power
      - lvgl.widget.show: lbl_n_temp
      - lvgl.widget.show: lbl_n_soc
    # Falls Touch verschoben/gespiegelt ist, hier kalibrieren:
    # transform:
    #   swap_xy: false
    #   mirror_x: false
    #   mirror_y: false

# Relais (teilen sich laut Doku IO1/IO2/IO40 mit dem I2S-Audio)
switch:
  - platform: gpio
    name: Relay 1
    id: switch_gpio_1
    pin: { number: 40, inverted: true }
  - platform: gpio
    name: Relay 2
    id: switch_gpio_2
    pin: { number: 2, inverted: true }
  - platform: gpio
    name: Relay 3
    id: switch_gpio_3
    pin: { number: 1, inverted: true }

# =============================================================================
#  FONTS
#  Montserrat (Text, via Google Fonts) + Material Design Icons (via URL).
#  Beim Build werden die Dateien einmalig heruntergeladen (HA hat Internet).
# =============================================================================
font:
