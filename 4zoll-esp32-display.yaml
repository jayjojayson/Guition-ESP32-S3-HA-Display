# =============================================================================
#  4Zoll-ESP32-Display  ·  Guition ESP32-S3-4848S040 (JC4848W540) · 480x480
#  Modernes Raumdisplay für Home Assistant über ESPHome + LVGL
# -----------------------------------------------------------------------------
#  START (Screensaver, ohne Menü):  Uhrzeit · Hausverbrauch · Außentemp · Batterie-SoC
#  Antippen  -> Seite "Licht" (8 Schalter)
#  Bottom-Menü verbindet:  Home · Licht · Wetter · Energie
#
#  ── ZUM FLASHEN / CH340 ──────────────────────────────────────────────────────
#  Das Board hat einen CH340-USB-Chip. Für den ERSTEN Flash per USB-C an den Mac
#  brauchst du den CH340-Treiber. macOS bringt oft
#  einen CH34x-Treiber mit, der Hersteller-Treiber ist aber zuverlässiger.
#  Erster Flash: Display per USB-C anstecken -> in HA ESPHome "Install" ->
#  "Plug into this computer" (bzw. web.esphome.io in Chrome/Edge). Danach läuft
#  alles per OTA über WLAN, dann ist kein USB oder Treiber nötig.
#
#  ── ANPASSEN ─────────────────────────────────────────────────────────────────
#  Alle mit  # <-- ENTITY  markierten entity_id / action-Ziele auf deine echten
#  Home-Assistant-Entitäten ändern (Growatt-Solar, Victron-Batterie, Homematic …).
#  Umlaute in festen Labels: die Standard-Fonts enthalten KEINE ä/ö/ü/ß. Wenn du
#  ein Label mit Umlaut brauchst, den Buchstaben unter dem jeweiligen font: in
#  "glyphs:" ergänzen (deshalb sind Default-Labels umlautfrei gehalten).
# =============================================================================

substitutions:
  name: "4zoll-esp32-display"
  friendly_name: "4Zoll-ESP32-Display"
  # ---- Farbschema (zentral änderbar) -----------------------------------------
  c_bg: "0x0A0E17"        # Hintergrund
  c_card: "0x151B26"      # Kartenfläche
  c_card_on: "0x243447"   # Karte "aktiv" (Licht an)
  c_text: "0xF3F6FC"      # Text hell
  c_muted: "0x7E8AA0"     # Text gedämpft
  c_cyan: "0x35D0E8"      # Akzent Uhr/Temp
  c_blue: "0x5B8DEF"      # Akzent Leistung
  c_green: "0x38D39F"     # Akzent Batterie
  c_amber: "0xF6B93B"     # Akzent Solar/Licht
  c_orange: "0xFF8A5B"    # Akzent Verbrauch

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# --- PSRAM (Framebuffer für das RGB-Panel) ------------------------------------
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

# WICHTIG: deinen bestehenden API-Key des in HA angelegten Geräts eintragen,
# sonst wird das Gerät als neu erkannt. (Am besten in secrets.yaml auslagern.)
api:
  encryption:
    key: xxxx                  # <-- deinen echten API-Key wieder eintragen

ota:
  - platform: esphome
    password: "5e68ede02d03f6d7f0710b7d5a5827f2"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "4Zoll-ESP32-Dis Fallback"
    password: xxxx                  # <-- dein Fallback-Passwort wieder eintragen

captive_portal:

# =============================================================================
#  TEMPERATURVERLAUF (12 h) fuer die Wetterseite
#  Alle 30 min wird die Aussentemp gesampelt -> 24 Punkte = 12 h.
#  Der Verlauf fuellt sich also erst ueber 12 h komplett.
# =============================================================================
globals:
  - id: g_thist
    type: float[8]
    restore_value: no
  - id: g_tcount
    type: int
    restore_value: no
    initial_value: "0"
  - id: g_bright
    type: int
    restore_value: yes
    initial_value: "100"
  - id: g_dim
    type: int
    restore_value: no          
    initial_value: "20"
  - id: g_settemp
    type: float
    restore_value: no
    initial_value: "21.0"
  - id: g_timeout
    type: int
    restore_value: no          
    initial_value: "30"
  - id: g_lastact
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: g_saver
    type: bool
    restore_value: no
    initial_value: "false"
  # wird nach dem ersten Interval-Tick true -> LVGL ist dann sicher initialisiert
  - id: g_lvgl_ready
    type: bool
    restore_value: no
    initial_value: "false"

interval:
  # Temperaturverlauf: alle 90 min ein Schritt -> 8 Punkte = 12 h
  # (zum Testen ruhig auf z. B. 2min stellen)
  - interval: 90min
    then:
      - lambda: |-
          float v = id(outside_temp).state;
          if (isnan(v)) return;
          for (int i = 1; i < 8; i++) id(g_thist)[i-1] = id(g_thist)[i];
          id(g_thist)[7] = v;
      - script.execute: redraw_chart
  # Screensaver-Timer (Sekunden ueber g_timeout einstellbar)
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return !id(g_lvgl_ready);"
          then:
            - lambda: "id(g_lvgl_ready) = true;"
      - if:
          condition:
            lambda: "return !id(g_saver) && (millis() - id(g_lastact)) > (uint32_t)(id(g_timeout) * 1000);"
          then:
            - lambda: "id(g_saver) = true;"
            - light.turn_on: { id: display_backlight, brightness: !lambda "return id(g_dim) / 100.0;" }
            - lvgl.page.show: { id: page_home, animation: FADE_IN, time: 300ms }
            - lvgl.widget.hide: nav_bar
            - lvgl.widget.update: { id: page_home, bg_image_opa: TRANSP }
            - lvgl.widget.update: { id: card_power, bg_opa: TRANSP }
            - lvgl.widget.update: { id: card_temp, bg_opa: TRANSP }
            - lvgl.widget.update: { id: card_soc, bg_opa: TRANSP }
            - lvgl.widget.hide: lbl_n_power
            - lvgl.widget.hide: lbl_n_temp
            - lvgl.widget.hide: lbl_n_soc

# =============================================================================
#  ZEIT
# =============================================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda 'return id(ha_time).now().is_valid() ? id(ha_time).now().strftime("%H:%M") : std::string("--:--");'
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            static const char* wd[] = {"So","Mo","Di","Mi","Do","Fr","Sa"};
            char b[24];
            snprintf(b, sizeof(b), "%s, %02d.%02d.%04d", wd[t.day_of_week-1], t.day_of_month, t.month, t.year);
            return std::string(b);
  - id: redraw_chart
    then:
      - lambda: |-
          float t[8];
          for (int i=0;i<8;i++) t[i]=id(g_thist)[i];
          float mn=1e9f, mx=-1e9f;
          for (int i=0;i<8;i++){ if(t[i]<mn)mn=t[i]; if(t[i]>mx)mx=t[i]; }
          if (mx-mn < 2.0f){ float m=(mn+mx)*0.5f; mn=m-1.0f; mx=m+1.0f; }
          const int xs[8] = {20,76,132,188,244,300,356,412};
          int yy[8];
          for (int i=0;i<8;i++) yy[i] = 112 - (int)((t[i]-mn)/(mx-mn)*68.0f);
          auto col = [](float v)->lv_color_t {
            float f=(v-2.0f)/20.0f; if(f<0)f=0; if(f>1)f=1;
            uint8_t r=(uint8_t)(246+f*(56-246));
            uint8_t g=(uint8_t)(196+f*(211-196));
            uint8_t b=(uint8_t)(69+f*(159-69));
            return lv_color_make(r,g,b);
          };
          static lv_point_precise_t sp[7][2];
          sp[0][0].x=xs[0]; sp[0][0].y=yy[0]; sp[0][1].x=xs[1]; sp[0][1].y=yy[1];
          lv_line_set_points(id(seg0)->obj, sp[0], 2);
          lv_obj_set_style_line_color(id(seg0)->obj, col((t[0]+t[1])*0.5f), LV_PART_MAIN);
          sp[1][0].x=xs[1]; sp[1][0].y=yy[1]; sp[1][1].x=xs[2]; sp[1][1].y=yy[2];
          lv_line_set_points(id(seg1)->obj, sp[1], 2);
          lv_obj_set_style_line_color(id(seg1)->obj, col((t[1]+t[2])*0.5f), LV_PART_MAIN);
          sp[2][0].x=xs[2]; sp[2][0].y=yy[2]; sp[2][1].x=xs[3]; sp[2][1].y=yy[3];
          lv_line_set_points(id(seg2)->obj, sp[2], 2);
          lv_obj_set_style_line_color(id(seg2)->obj, col((t[2]+t[3])*0.5f), LV_PART_MAIN);
          sp[3][0].x=xs[3]; sp[3][0].y=yy[3]; sp[3][1].x=xs[4]; sp[3][1].y=yy[4];
          lv_line_set_points(id(seg3)->obj, sp[3], 2);
          lv_obj_set_style_line_color(id(seg3)->obj, col((t[3]+t[4])*0.5f), LV_PART_MAIN);
          sp[4][0].x=xs[4]; sp[4][0].y=yy[4]; sp[4][1].x=xs[5]; sp[4][1].y=yy[5];
          lv_line_set_points(id(seg4)->obj, sp[4], 2);
          lv_obj_set_style_line_color(id(seg4)->obj, col((t[4]+t[5])*0.5f), LV_PART_MAIN);
          sp[5][0].x=xs[5]; sp[5][0].y=yy[5]; sp[5][1].x=xs[6]; sp[5][1].y=yy[6];
          lv_line_set_points(id(seg5)->obj, sp[5], 2);
          lv_obj_set_style_line_color(id(seg5)->obj, col((t[5]+t[6])*0.5f), LV_PART_MAIN);
          sp[6][0].x=xs[6]; sp[6][0].y=yy[6]; sp[6][1].x=xs[7]; sp[6][1].y=yy[7];
          lv_line_set_points(id(seg6)->obj, sp[6], 2);
          lv_obj_set_style_line_color(id(seg6)->obj, col((t[6]+t[7])*0.5f), LV_PART_MAIN);
          lv_obj_set_pos(id(dot0), xs[0]-6, yy[0]-6);
          lv_obj_set_style_bg_color(id(dot0), col(t[0]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot1), xs[1]-6, yy[1]-6);
          lv_obj_set_style_bg_color(id(dot1), col(t[1]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot2), xs[2]-6, yy[2]-6);
          lv_obj_set_style_bg_color(id(dot2), col(t[2]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot3), xs[3]-6, yy[3]-6);
          lv_obj_set_style_bg_color(id(dot3), col(t[3]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot4), xs[4]-6, yy[4]-6);
          lv_obj_set_style_bg_color(id(dot4), col(t[4]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot5), xs[5]-6, yy[5]-6);
          lv_obj_set_style_bg_color(id(dot5), col(t[5]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot6), xs[6]-6, yy[6]-6);
          lv_obj_set_style_bg_color(id(dot6), col(t[6]), LV_PART_MAIN);
          lv_obj_set_pos(id(dot7), xs[7]-6, yy[7]-6);
          lv_obj_set_style_bg_color(id(dot7), col(t[7]), LV_PART_MAIN);
      - lvgl.label.update:
          id: gv0
          text: !lambda |-
            float v = id(g_thist)[0];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv1
          text: !lambda |-
            float v = id(g_thist)[1];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv2
          text: !lambda |-
            float v = id(g_thist)[2];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv3
          text: !lambda |-
            float v = id(g_thist)[3];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv4
          text: !lambda |-
            float v = id(g_thist)[4];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv5
          text: !lambda |-
            float v = id(g_thist)[5];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv6
          text: !lambda |-
            float v = id(g_thist)[6];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;
      - lvgl.label.update:
          id: gv7
          text: !lambda |-
            float v = id(g_thist)[7];
            char b[12]; snprintf(b, sizeof(b), "%.1f", v);
            std::string r(b); for (auto &c : r) if (c=='.') c=',';  r += "\u00B0";
            return r;

# =============================================================================
#  HA-EINSTELLBARE REGLER  (erscheinen in Home Assistant als Number-Entities)
#  Boot-sicher: on_value setzt NUR die Globals, KEINE LVGL-Aktionen.
# =============================================================================
number:
  - platform: template
    name: "Standby-Dimmung"
    id: num_dim
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - lambda: "id(g_dim) = (int) x;"
  - platform: template
    name: "Screensaver-Timeout"
    id: num_timeout
    icon: "mdi:timer-outline"
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    on_value:
      - lambda: "id(g_timeout) = (int) x;"

# =============================================================================
#  BENACHRICHTIGUNG  (aus HA befüllbar, erscheint als Popup auf dem Display)
#  Boot-sicher: on_value ruft LVGL nur auf, wenn das Display bereit ist.
# =============================================================================
text:
  - platform: template
    name: "Display Nachricht"
    id: notify_text
    icon: "mdi:message-text"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 200
    on_value:
      - if:
          condition:
            lambda: "return id(g_lvgl_ready);"
          then:
            - if:
                condition:
                  lambda: "return !x.empty();"
                then:
                  - lvgl.label.update: { id: popup_text, text: !lambda "return x;" }
                  - lvgl.widget.show: popup
                else:
                  - lvgl.widget.hide: popup

# =============================================================================
#  HOME-ASSISTANT-DATEN  ->  Labels aktualisieren
#  (entity_id jeweils auf deine echten Entitäten anpassen)
# =============================================================================
sensor:
  # Hausstromverbrauch (W) – Startseite
  - platform: homeassistant
    id: house_power
    entity_id: sensor.total_power          # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_home_power
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f W", x); return std::string(b);
      - lvgl.label.update:
          id: ic_power
          text_color: !lambda |-
            if (isnan(x)) return lv_color_hex(0x5B8DEF);
            if (x < 300) return lv_color_hex(0x38D39F);
            if (x < 500) return lv_color_hex(0xF6C445);
            if (x < 800) return lv_color_hex(0xFF8A3D);
            return lv_color_hex(0xFF5A5A);

  # Außentemperatur (°C) – Startseite + Wetterseite
  - platform: homeassistant
    id: outside_temp
    entity_id: sensor.aussentemperatur_temperatur                # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_home_temp
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.1f°", x); return std::string(b);
      - lvgl.label.update:
          id: ic_temp
          text_color: !lambda |-
            if (isnan(x)) return lv_color_hex(0x35D0E8);
            if (x < 10) return lv_color_hex(0x5B8DEF);
            if (x < 16) return lv_color_hex(0x38D39F);
            if (x < 21) return lv_color_hex(0xF6C445);
            if (x < 25) return lv_color_hex(0xFF8A3D);
            return lv_color_hex(0xFF5A5A);
      - lvgl.label.update:
          id: lbl_weather_temp
          text: !lambda |-
            if (isnan(x)) return std::string("--°");
            char b[16]; snprintf(b, sizeof(b), "%.1f°", x); return std::string(b);
      - lambda: |-
          if (isnan(x)) return;
          if (id(g_tcount) == 0) { for (int i=0;i<8;i++) id(g_thist)[i] = x; id(g_tcount) = 8; }
          id(g_thist)[7] = x;
      - script.execute: redraw_chart

  # Batterie-SoC (%) – Startseite
  - platform: homeassistant
    id: battery_soc
    entity_id: sensor.victron_battery_soc_3                    # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_home_soc
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f %%", x); return std::string(b);
      - lvgl.label.update:
          id: ic_soc
          text_color: !lambda |-
            if (isnan(x)) return lv_color_hex(0x38D39F);
            if (x < 15) return lv_color_hex(0xFF5A5A);
            if (x < 30) return lv_color_hex(0xFF8A3D);
            if (x < 50) return lv_color_hex(0xF6C445);
            return lv_color_hex(0x38D39F);
      - lvgl.label.update:
          id: ic_soc
          text: !lambda |-
            if (isnan(x)) return std::string("\U000F0079");
            int lvl = (int)((x + 5) / 10) * 10;
            if (lvl > 100) lvl = 100;
            if (lvl < 0) lvl = 0;
            switch (lvl) {
              case 0:   return std::string("\U000F008E");
              case 10:  return std::string("\U000F007A");
              case 20:  return std::string("\U000F007B");
              case 30:  return std::string("\U000F007C");
              case 40:  return std::string("\U000F007D");
              case 50:  return std::string("\U000F007E");
              case 60:  return std::string("\U000F007F");
              case 70:  return std::string("\U000F0080");
              case 80:  return std::string("\U000F0081");
              case 90:  return std::string("\U000F0082");
              default:  return std::string("\U000F0079");
            }

  # Luftfeuchte (%) – Wetterseite
  - platform: homeassistant
    id: out_humidity
    entity_id: sensor.aussentemperatur_luftfeuchtigkeit              # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_weather_hum
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f %%", x); return std::string(b);

  # Wind (km/h) – Wetterseite
  - platform: homeassistant
    id: out_wind
    entity_id: sensor.dein_ort_windgeschwindigkeit            # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_weather_wind
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f km/h", x); return std::string(b);

  # Solarertrag heute (kWh) – Energieseite
  - platform: homeassistant
    id: solar_today
    entity_id: sensor.erzeugung_taglich_kombi_pvanlagennach_ohne_abzug_einspeisung              # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_e_solar
          text: !lambda |-
            if (isnan(x)) return std::string("-- kWh");
            char b[16]; snprintf(b, sizeof(b), "%.1f kWh", x); return std::string(b);

  # Batterie geladen heute (kWh) – Energieseite
  - platform: homeassistant
    id: batt_charged_today
    entity_id: sensor.batterieladung_vr_kwh_taglich_2          # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_e_batt
          text: !lambda |-
            if (isnan(x)) return std::string("-- kWh");
            char b[16]; snprintf(b, sizeof(b), "%.1f kWh", x); return std::string(b);

  # Hausverbrauch heute (kWh) – Energieseite
  - platform: homeassistant
    id: house_today
    entity_id: sensor.verbrauch_taglich_nach_abzug             # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_e_house
          text: !lambda |-
            if (isnan(x)) return std::string("-- kWh");
            char b[16]; snprintf(b, sizeof(b), "%.1f kWh", x); return std::string(b);

  # Netzbezug heute (kWh) – Energieseite
  - platform: homeassistant
    id: grid_today
    entity_id: sensor.stromverbrauch_taglich                 # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: lbl_e_grid
          text: !lambda |-
            if (isnan(x)) return std::string("-- kWh");
            char b[16]; snprintf(b, sizeof(b), "%.1f kWh", x); return std::string(b);

  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    on_value:
      - lvgl.label.update:
          id: lbl_sys_rssi
          text: !lambda |-
            int r = (int) x;
            const char* q = r >= -60 ? "Gut" : (r >= -72 ? "Mittel" : "Schwach");
            char b[48]; snprintf(b, sizeof(b), "Signal: %d dBm (%s)", r, q); return std::string(b);

  - platform: homeassistant
    id: heat_target
    entity_id: climate.wandthermostat
    attribute: temperature
    on_value:
      - lambda: "id(g_settemp) = x;"
      - lvgl.arc.update: { id: heat_arc, value: !lambda "return (int)(x * 2);" }
      - lvgl.label.update:
          id: lbl_heat_val
          text: !lambda |-
            char b[12]; snprintf(b, sizeof(b), "%.1f°", x); return std::string(b);
  - platform: homeassistant
    id: heat_current
    entity_id: sensor.wandthermostat_temperatur
    on_value:
      - lvgl.label.update:
          id: lbl_heat_cur
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "Ist %.1f°", x); return std::string(b);

text_sensor:
  # Wetterzustand (weather.*) -> Icon + Text auf der Wetterseite
  - platform: homeassistant
    id: weather_state
    entity_id: weather.dein_ort                          # <-- ENTITY
    on_value:
      - lvgl.label.update:
          id: ic_weather
          text: !lambda |-
            std::string s = x;
            if (s == "sunny")                         return std::string("\U000F0599");
            if (s == "clear-night")                   return std::string("\U000F0594");
            if (s == "partlycloudy")                  return std::string("\U000F0595");
            if (s == "cloudy")                        return std::string("\U000F0590");
            if (s == "fog")                           return std::string("\U000F0591");
            if (s == "rainy")                         return std::string("\U000F0597");
            if (s == "pouring")                       return std::string("\U000F0596");
            if (s == "snowy" || s == "snowy-rainy")   return std::string("\U000F0598");
            if (s == "lightning" || s == "lightning-rainy") return std::string("\U000F0593");
            if (s == "windy" || s == "windy-variant") return std::string("\U000F059D");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_weather_text
          text: !lambda |-
            std::string s = x;
            if (s == "sunny")                         return std::string("Sonnig");
            if (s == "clear-night")                   return std::string("Klar");
            if (s == "partlycloudy")                  return std::string("Wolkig");
            if (s == "cloudy")                        return std::string("Wolkig");
            if (s == "fog")                           return std::string("Neblig");
            if (s == "rainy")                         return std::string("Regen");
            if (s == "pouring")                       return std::string("Starkregen");
            if (s == "snowy")                         return std::string("Schnee");
            if (s == "lightning" || s == "lightning-rainy") return std::string("Gewitter");
            if (s == "windy" || s == "windy-variant") return std::string("Windig");
            return s;

# =============================================================================
#  LICHTZUSTÄNDE aus HA  ->  Button-Optik (an/aus) spiegeln
#  Ein binary_sensor je Lampe. entity_id auf deine 8 Lichter anpassen.
# =============================================================================
  - platform: wifi_info
    ssid:
      id: ti_ssid
      name: "SSID"
      on_value:
        - lvgl.label.update:
            id: lbl_sys_ssid
