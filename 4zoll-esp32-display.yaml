          else:
            - lvgl.widget.update: { id: btn_mode_auto, bg_color: "${c_card}" }
      - if:
          condition: { lambda: 'return x == "off";' }
          then:
            - lvgl.widget.update: { id: btn_mode_off, bg_color: "0x33415A" }
          else:
            - lvgl.widget.update: { id: btn_mode_off, bg_color: "${c_card}" }
  - platform: homeassistant
    id: heat_preset
    entity_id: climate.wandthermostat
    attribute: preset_mode
    on_value:
      - if:
          condition: { lambda: 'return x == "boost";' }
          then:
            - lvgl.widget.update: { id: btn_mode_boost, bg_color: "0xC2571E" }
          else:
            - lvgl.widget.update: { id: btn_mode_boost, bg_color: "${c_card}" }
